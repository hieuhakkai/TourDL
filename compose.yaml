services:
  mysql:
    image: mysql:8.4
    container_name: tourdl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourdlhdv}
      MYSQL_USER: ${MYSQL_USER:-tourdl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tourdlpass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Access/database_HDV.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./Backend
    container_name: tourdl-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tourdlhdv}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-tourdl}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-tourdlpass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AUTH_TOKEN_JWTSECRET: ${JWT_SECRET:-tourdl-dev-jwt-secret-key-1234567890}
      AUTH_TOKEN_EXPIRATIONINMILS: ${JWT_EXPIRATION:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME:-dummy@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dummy-password}
      SUPPORT_EMAIL: ${MAIL_USERNAME:-dummy@example.com}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
    container_name: tourdl-frontend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PORT: 3124
      URL: http://localhost:3124
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-tourdlhdv}
      DB_USER: ${MYSQL_USER:-tourdl}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tourdlpass}
      DB_PORT: 3306
      DB_DIALECT: mysql
      COOKIE_SIGNED: ${COOKIE_SIGNED:-tourdl-cookie-secret}
      JWT_SECRET: ${JWT_SECRET:-tourdl-dev-jwt-secret-key-1234567890}
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_IN: ${JWT_EXPIRATION:-3600000}
      BACKEND_API_URL: http://backend:8080
      APP_FRONTEND_URL: http://localhost:3124
    ports:
      - "3124:3124"

volumes:
  mysql_data:
